<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blink+A: Carnivore deterrent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4e4; --ink:#23302a; --muted:#5d6b62; --line:#d8dcc0;
  --shadow:0 1px 3px rgba(35,48,42,.12);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#1a201c; --ink:#e9ecdf; --muted:#a6b0a8; --line:#38423b; --shadow:0 1px 3px rgba(0,0,0,.4); }
}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
}
header{border-bottom:1px solid var(--line)}
header div{max-width:860px; margin:0 auto; padding:.8rem 1rem}
h1{margin:0; font-size:1.35rem; font-weight:500}
h1 span{color:var(--muted); font-weight:400}
main{max-width:860px; margin:0 auto; padding:1.25rem 1rem 3rem}
img{
  display:block; width:100%; height:auto; margin:0 0 1.25rem;
  background:#fff; border-radius:4px; box-shadow:var(--shadow);
}
</style>
</head>
<body>
<header>
  <div><h1>Blink+A <span>Carnivore deterrent</span></h1></div>
</header>
<main>
  <img src="brochureBlinkAenglish1.jpg" width="4167" height="18642"
       alt="Blink+A brochure, page 1">
  <img src="brochureBlinkAenglish2.jpg" width="4167" height="18658"
       alt="Blink+A brochure, page 2" loading="lazy">
</main>
</body>
</html>
